<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidequest</title>
<script src="shared/analytics.js" async></script>
<link rel="icon" href="design/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/base.css">
<link rel="stylesheet" href="design/components.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .home { width: 100%; max-width: 260px; display: flex; flex-direction: column; gap: 24px; padding: 24px; }
  .home p { margin: 0; color: var(--ink-secondary); }
  .home .actions { flex-direction: column; align-items: flex-start; gap: 8px; }
</style>
</head>
<body>
<main class="home">
  <div class="mark" aria-hidden="true"></div>
  <p>Simple set of tools to simplify your freelancing tasks</p>
  <div class="actions">
    <a class="btn" href="agreements.html">Make an agreement</a>
    <a class="btn" href="invoices.html">Make an invoice</a>
  </div>
</main>
<script>
  // Opened from a web address, the pages are served without .html; from a file they need it.
  if (location.protocol !== 'file:') for (const a of document.querySelectorAll('a[href$=".html"]')) a.href = a.getAttribute('href').replace(/\.html$/, '');
</script>
</body>
</html>
