<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices</title>
<link rel="icon" href="design/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/base.css">
<link rel="stylesheet" href="design/components.css">
<style>
@page { size: A4; margin: 0; }
/* document-only tokens for the printed page (mirrored in the Figma "Invoice template" variables) */
:root { --rule: #ebebeb; --rule-dark: #ebebeb; --tint: #dae4fb; --paper: #fafafa; --ls-body: 0.2pt; --ls-label: 0.3pt; }

/* ---------- app layout ---------- */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }   /* same list width as agreements.html */
.invlist { overflow: auto; background: #fff; padding: 16px; }
.main { position: relative; overflow: hidden; display: flex; flex-direction: column; }
.preview { position: relative; flex: 1; overflow: auto; padding: 16px 28px 56px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; background: #fff; }
.preview > * { margin-left: auto; margin-right: auto; }
.scaleBox { position: relative; flex: none; }
.scale { transform-origin: top left; }
.pv-tools { flex: none; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------- the invoice page (units in pt, 1:1 with Figma/A4) ---------- */
.page {
  width: 595pt; min-height: 842pt; background: #fff; color: var(--ink);
  font-family: 'Instrument Sans', sans-serif; font-variation-settings: 'wdth' var(--wdth);
  font-size: 9pt; line-height: 14pt; letter-spacing: var(--ls-body); font-weight: 450; display: flex; flex-direction: column;
  border: 1px solid var(--line);
  transition: opacity .15s ease;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.page.fading { opacity: 0; }
.page p { margin: 0; }
.pg-header { background: var(--paper); padding: 32pt; display: flex; justify-content: space-between; align-items: flex-start; }
.pg-brand { display: flex; gap: 12pt; align-items: flex-start; }
.pg-logo { height: 20pt; display: flex; align-items: center; } /* matches the 20pt company line */
.pg-logo img { width: 21.9pt; height: 10pt; display: block; object-fit: contain; }
.pg-brand-text { display: flex; flex-direction: column; gap: 8pt; }
.pg-company { font-weight: 600; font-size: 16pt; line-height: 20pt; letter-spacing: 0; white-space: nowrap; }
.kv { display: flex; flex-direction: column; gap: 2pt; font-size: 9pt; line-height: 14pt; }
.kv-row { display: flex; align-items: flex-start; }
.kv-row .k { color: var(--muted); white-space: nowrap; }
.kv-row .v { flex: 1; min-width: 0; text-align: right; padding-left: 12pt; }
.kv-row .pct { width: 57pt; text-align: right; }
.pg-meta { width: 164pt; }
.pg-body { padding: 32pt; display: flex; flex-direction: column; gap: 32pt; flex: 1; }
.pg-row2 { display: flex; gap: 40pt; align-items: flex-start; }
.pg-row2 > .block { flex: 1; min-width: 0; }
.pg-row2 > .block.half { flex: none; width: 237.5pt; }
.block-label { border-left: 1pt solid var(--accent); padding-left: 8pt; font-size: 7pt; line-height: 13pt; font-weight: 629; letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--accent); }
.block-data { border-left: 1pt solid var(--tint); padding: 4pt 0 4pt 8pt; display: flex; flex-direction: column; gap: 4pt; font-size: 9pt; line-height: 13pt; }
.block-data p { white-space: pre-line; overflow-wrap: anywhere; }
.block-data .name { font-weight: 600; }
.block-data .gap { margin-top: 10pt; }
.rates { display: flex; flex-direction: column; align-items: flex-end; }
.rates .block-label { width: 100%; }
.tbl { width: 100%; border-collapse: collapse; table-layout: auto; }
.tbl th, .tbl td { padding-left: 16pt; text-align: right; white-space: nowrap; vertical-align: middle; font-weight: inherit; }
.tbl .c-item { padding-left: 0; width: 100%; text-align: left; white-space: pre-line; overflow-wrap: anywhere; }
.t-head th { padding-top: 8pt; padding-bottom: 4pt; border-bottom: 0.5pt solid var(--rule-dark); font-size: 8pt; line-height: 12pt; color: var(--muted); }
.t-row td { padding-top: 4pt; padding-bottom: 4pt; border-bottom: 0.5pt solid var(--rule); font-size: 9pt; line-height: 14pt; }
/* summary table: same head and row styles as the items table, half the page wide, right-aligned */
.sum-wrap { width: 100%; display: flex; justify-content: flex-end; padding-top: 16pt; }
.tbl.sum { width: 237.5pt; flex: none; }
.tbl.sum .c-item { white-space: nowrap; }
.t-total td { padding-top: 8pt; font-size: 9pt; line-height: 14pt; vertical-align: baseline; border-top: 0.5pt solid var(--rule-dark); }
.t-total.alone td { border-top: 0; }   /* no tax: the total stands on its own, no rule above */
.t-total td:last-child { font-weight: 700; font-size: 14pt; line-height: 14pt; }
.pg-foot { flex: 1; display: flex; justify-content: space-between; align-items: flex-end; }
.pg-foot .half { width: 237.5pt; }
.sig { display: flex; flex-direction: column; align-items: center; }
.sig img, .sig-blank { width: 111pt; height: 57pt; display: block; object-fit: contain; }
.sig-name { border-top: 0.5pt solid var(--rule); padding-top: 4pt; text-align: center; white-space: nowrap; }
.sig-name .n { font-weight: 600; font-size: 9pt; line-height: 14pt; color: var(--ink); }
.sig-name .s { font-size: 8pt; line-height: 13pt; color: var(--muted); }

/* in-place editing chrome (screen only) */
.block { position: relative; }
.page.editable .ed { cursor: text; outline: none; padding: 0 2px; margin: 0 -2px; border-radius: var(--radius); background: transparent; transition: background-color var(--t-hover); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.page.editable .ed:hover, .page.editable .ed:focus { background: var(--fill-hover); }
.page.editable .ed:empty::before { content: '\00a0'; }
.page.editable .c-item > .ed { display: block; min-height: 1lh; }
.page.editable .ed:focus { outline: none; caret-color: var(--accent); }
.page .blk-chip, .page .ghost, .page .model-tabs, .page .row-x, .page .t-add, .page .pg-chips { display: none; }
.page.editable .blk-chip { display: inline-flex; position: absolute; top: 0; right: 0; font: inherit; font-size: 9pt; line-height: 14pt; padding: 0; border: 0; background: none; color: var(--ink-secondary); cursor: pointer; opacity: 0; transition: opacity var(--t-hover), color var(--t-hover); letter-spacing: inherit; }
/* secondary: hidden until the block is hovered, dimmed while it is, full on its own hover, never underlined */
.page.editable .block:hover .blk-chip { opacity: 1; }
.page.editable .block:hover .blk-chip:hover { color: var(--ink-primary); text-decoration: underline; text-underline-offset: var(--underline); }
.page.editable .ghost { display: inline-flex; font: inherit; font-size: 9pt; line-height: 14pt; letter-spacing: inherit; color: var(--ink-secondary); background: none; border: 0; padding: 0; cursor: pointer; opacity: 0; transition: opacity var(--t-hover), color var(--t-hover); }
.page.editable:hover .ghost, .page.editable .ghost.show { opacity: 1; }
.page.editable .ghost:hover { color: var(--ink-primary); text-decoration: underline; text-underline-offset: var(--underline); }
.ghost-host { display: flex; align-items: flex-start; }
.pg-meta { position: relative; }
.page.editable .ed[data-kind=date] { cursor: pointer; }
.rates { position: relative; }
.page.editable .model-tabs { display: inline-flex; gap: 0.35em; margin-left: 12pt; vertical-align: top; height: 13pt; align-items: center; opacity: 0; }
.page.editable .model-tabs > * + *::before { content: '/'; display: inline-block; color: var(--line-strong); margin-right: 0.35em; pointer-events: none; }
.page.editable .rates:hover .model-tabs { opacity: 1; }
.page.editable .model-tabs button { font: inherit; font-size: 9pt; line-height: 13pt; letter-spacing: var(--ls-body); font-weight: 450; text-transform: none; padding: 0; border: 0; background: transparent; color: var(--ink-secondary); transition: color var(--t-hover); cursor: pointer; }
.page.editable .model-tabs button:hover, .page.editable .model-tabs button.on { color: var(--ink-primary); }
.page.editable .model-tabs button.on { pointer-events: none; cursor: default; }
.page.editable .t-row::after { content: ''; position: absolute; left: 100%; top: 0; bottom: 0; width: 24pt; z-index: 0; }
.t-row { position: relative; }
.page.editable .row-x { display: flex; align-items: center; justify-content: center; position: absolute; right: -20pt; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; line-height: 1; border: 0; background: none; color: var(--ink-secondary); cursor: pointer; opacity: 0; padding: 0; z-index: 1; transition: opacity var(--t-hover), color var(--t-hover); }
.page.editable .row-x:hover { opacity: 1; color: var(--ink-primary); }
.page.editable .t-row:hover .row-x { opacity: 1; }
.page.editable .t-row:hover .row-x:hover { color: var(--ink-primary); }
.page.editable .t-add { display: block; position: absolute; left: 0; top: 100%; padding: 4pt 0; line-height: 16pt; opacity: 0; }
.page.editable .rates:hover .t-add { opacity: 1; }
.t-add-host { position: relative; width: 100%; }
.page.editable .t-add .ghost { padding: 0; line-height: 16pt; }

@media print {
  html, body { background: #fff; height: auto; overflow: visible; }
  .blk-chip, .ghost, .ghost-host, .model-tabs, .row-x, .t-add, .pg-chips, .pv-tools, .pop, .toast, .banner, dialog { display: none !important; }
  .ed { outline: none !important; background: none !important; padding: 0 !important; margin: 0 !important; }
  .app { display: block; height: auto; }
  .invlist { display: none !important; }
  .main { display: block; overflow: visible; height: auto; }
  .preview { display: block !important; padding: 0; overflow: visible; }
  .scaleBox { width: auto !important; height: auto !important; }
  .scale { transform: none !important; }
  .page { border: 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="invlist" id="invlist"></aside>

  <main class="main">
    <div class="preview" id="preview">
      <div class="pv-tools" id="pvTools">
        <span id="pvSeg"></span>
        <span class="actions">
          <button class="btn" id="btnDel">Delete</button>
          <button class="btn secondary" id="btnDup">Duplicate</button>
          <button class="btn secondary" id="btnPdf" title="Save the invoice and download it as a PDF">Download</button>
          <button class="btn" id="btnSave">Save invoice</button>
        </span>
      </div>
      <div class="scaleBox" id="scaleBox"><div class="scale" id="scale"><div class="page" id="page"></div></div></div>
    </div>
  </main>

</div>
<script src="design/ui.js"></script>
<script src="shared/dataset.js"></script>
<script src="design/store.js"></script>
<script>dataset.loadFiles('invoices', 'parties');</script>

<script>
/* ======================= basics ======================= */
const LS_KEY = dataset.key('scs-invoices-own');   // only the user's own data is saved; the sample set lives in the seeds (shared/dataset.js)
let disk = null; // folder store, attached after first render
const GST_RATE = 18;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// Local-date helpers. toISOString() would shift to UTC and lose a day in IST.
const { isoLocal, today, addDays, fmtDate, esc, field } = ui;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || '').trim().toLowerCase();

// GSTIN state codes (first two digits)
const STATE_CODES = { '01': 'Jammu and Kashmir', '02': 'Himachal Pradesh', '03': 'Punjab', '04': 'Chandigarh', '05': 'Uttarakhand', '06': 'Haryana', '07': 'Delhi', '08': 'Rajasthan', '09': 'Uttar Pradesh', '10': 'Bihar', '11': 'Sikkim', '12': 'Arunachal Pradesh', '13': 'Nagaland', '14': 'Manipur', '15': 'Mizoram', '16': 'Tripura', '17': 'Meghalaya', '18': 'Assam', '19': 'West Bengal', '20': 'Jharkhand', '21': 'Odisha', '22': 'Chhattisgarh', '23': 'Madhya Pradesh', '24': 'Gujarat', '26': 'Dadra and Nagar Haveli and Daman and Diu', '27': 'Maharashtra', '29': 'Karnataka', '30': 'Goa', '31': 'Lakshadweep', '32': 'Kerala', '33': 'Tamil Nadu', '34': 'Puducherry', '35': 'Andaman and Nicobar Islands', '36': 'Telangana', '37': 'Andhra Pradesh', '38': 'Ladakh' };
const stateFromGstin = g => STATE_CODES[String(g || '').trim().slice(0, 2)] || '';

// Amounts always print with the ISO code ("INR 40,800"); INR groups in lakhs, the rest in thousands.
const CURRENCIES = {
  INR: { name: 'INR (Indian rupee)', code: 'INR', grouping: 'indian' },
  USD: { name: 'USD (US dollar)', code: 'USD', grouping: 'western' },
  EUR: { name: 'EUR (Euro)', code: 'EUR', grouping: 'western' },
  GBP: { name: 'GBP (Pound sterling)', code: 'GBP', grouping: 'western' },
};
const curKey = c => (c && CURRENCIES[c.code]) ? c.code : 'INR';
// Any ISO code is allowed; INR groups in lakhs, everything else in thousands.
const curFor = code => { code = String(code || 'INR').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'INR'; return CURRENCIES[code] ? { ...CURRENCIES[code] } : { name: code, code, grouping: 'western' }; };

/* Pricing models = which columns the cost table shows and how a row's amount is computed. */
// Models with `keys` link three numbers. Whichever of the three you edited least recently is the one that gets recalculated
// (r.edited remembers the order), so the two you typed last are always preserved.
const MODELS = {
  hourly: { name: 'Billed hours × hourly rate', tab: 'Hourly', keys: ['qty', 'rate', 'amount'], defaultEdited: ['rate', 'qty'], // untouched items: amount is derived; editing the amount changes the rate, hours stay
    cols: [{ key: 'rate', label: c => `Hourly rate (${c.code})`, w: 73, type: 'number', render: (r, c) => fmtNum(num(r.rate), c.grouping, 'always') },
           { key: 'qty', label: 'Billed hours', w: 64, type: 'number', render: r => fmtNum(num(r.qty), 'western', 'auto') }],
    solve: (r, k) => { if (k === 'amount') r.amount = round2(num(r.qty) * num(r.rate)); else if (k === 'qty') r.qty = num(r.rate) ? round2(num(r.amount) / num(r.rate)) : 0; else r.rate = num(r.qty) ? round2(num(r.amount) / num(r.qty)) : 0; } },
  weekly: { name: 'Weeks × weekly rate', tab: 'Weekly', keys: ['qty', 'rate', 'amount'], defaultEdited: ['rate', 'qty'],
    cols: [{ key: 'rate', label: c => `Weekly rate (${c.code})`, w: 73, type: 'number', render: (r, c) => fmtNum(num(r.rate), c.grouping, 'always') },
           { key: 'qty', label: 'Billed weeks', w: 64, type: 'number', render: r => fmtNum(num(r.qty), 'western', 'auto') }],
    solve: (r, k) => { if (k === 'amount') r.amount = round2(num(r.qty) * num(r.rate)); else if (k === 'qty') r.qty = num(r.rate) ? round2(num(r.amount) / num(r.rate)) : 0; else r.rate = num(r.qty) ? round2(num(r.amount) / num(r.qty)) : 0; } },
  share: { name: 'Share of a final project cost', tab: 'Share', keys: ['base', 'share', 'amount'], defaultEdited: ['base', 'share'], // editing the amount changes the project cost, share stays
    cols: [{ key: 'base', label: 'Final project cost', w: 73, type: 'number', render: (r, c) => fmtNum(num(r.base), c.grouping, 'always') },
           { key: 'share', label: 'Share', w: 64, type: 'number', render: r => fmtPct(r.share, 0) }],
    solve: (r, k) => { if (k === 'amount') r.amount = round2(num(r.base) * num(r.share) / 100); else if (k === 'base') r.base = num(r.share) ? round2(num(r.amount) / (num(r.share) / 100)) : 0; else r.share = num(r.base) ? round2(num(r.amount) / num(r.base) * 100) : 0; } },
};
// Note that `key` was just edited, then recompute the field edited longest ago.
function markEdited(r, model, key) {
  const M = MODELS[model]; if (!M?.keys) return;
  r.edited = (r.edited || []).filter(k => k !== key && M.keys.includes(k)); r.edited.push(key);
  recalc(r, model);
}
function derivedKey(r, model) { const M = MODELS[model]; if (!M?.keys) return null; const ed = r.edited || []; return M.keys.filter(k => !ed.includes(k)).concat(ed.filter(k => M.keys.includes(k)))[0]; }
function recalc(r, model) { const M = MODELS[model]; if (!M?.keys) return; M.solve(r, derivedKey(r, model)); }
const itemAmount = (r, model) => { const rr = { ...r }; recalc(rr, model); return num(rr.amount); };

/* ======================= seed data ======================= */
const SEED = {   // mock data: every name, number and address here is made up. Clients and issuers live in shared/parties.js.
  banks: [
    { id: 'bank-example-co', label: 'Example Bank (company)', paymentMethod: '', rows: [
      { label: 'Company name', value: 'Northwind Design Studio' }, { label: 'Acc. holder name', value: 'Alex Rao' }, { label: 'Acc. number', value: '000123456789' },
      { label: 'IFSC Code', value: 'EXMP0001234' }, { label: 'SWIFT Code', value: 'EXMPINBBXXX' }, { label: 'Bank Name', value: 'Example Bank' }] },
    { id: 'bank-example', label: 'Example Bank (personal)', paymentMethod: 'Bank transfer', rows: [
      { label: 'Name', value: 'Alex Rao' }, { label: 'Account number', value: '000987654321' }, { label: 'IFSC Code', value: 'EXMP0001234' },
      { label: 'SWIFT Code', value: 'EXMPINBBXXX' }, { label: 'Bank Name', value: 'Example Bank' }] },
    { id: 'bank-sample', label: 'Sample Bank', paymentMethod: 'Bank transfer (via a payroll provider)', rows: [
      { label: 'Name', value: 'Alex Rao' }, { label: 'Account number', value: '111122223333' }, { label: 'IFSC Code', value: 'SMPL0000001' },
      { label: 'SWIFT Code', value: 'SMPLINBB001' }, { label: 'Bank Name', value: 'Sample Bank' }] },
  ],
};
// A snapshot is the profile's data copied into the invoice, so later profile edits don't rewrite old invoices.
const snapshot = p => { const { id, ...rest } = clone(p); rest.profileId = id; return rest; };
function seedInvoices() {
  const I = id => snapshot(parties.SEED.issuers.find(x => x.id === id));
  const B = id => snapshot(SEED.banks.find(x => x.id === id));
  const C = id => snapshot(parties.SEED.clients.find(x => x.id === id));
  const cur = k => ({ ...CURRENCIES[k] });
  const base = n => ({ id: 'seed-' + n, additional: '', note: '', createdAt: Date.now(), updatedAt: Date.now() });
  return [
    { ...base(1), number: 'E2026-01', series: 'E', issueDate: '2026-03-06', dueDate: '2026-04-05', client: C('cl-acme'), issuer: I('iss-mh'), bank: B('bank-example'),
      currency: cur('GBP'), model: 'fixed', items: [{ desc: 'Product design and creative support', hsn: '998314', rateText: 'Fixed amount', amount: 4200 }] },
    { ...base(2), number: 'E2025-01', series: 'E', issueDate: '2025-05-14', dueDate: '2025-06-13', client: C('cl-acme'), issuer: I('iss-mh'), bank: B('bank-example'),
      currency: cur('GBP'), model: 'fixed', items: [{ desc: 'Product design and creative support', hsn: '998314', rateText: 'Fixed amount', amount: 5600 }, { desc: 'Reimbursement', hsn: '-', rateText: 'Fixed amount', amount: 90 }] },
    { ...base(3), number: 'D2026-03', series: 'D', issueDate: '2026-09-11', dueDate: '2026-10-11', client: C('cl-riya'), issuer: I('iss-ka'), bank: B('bank-example-co'),
      currency: cur('INR'), model: 'share', items: [{ desc: 'Product design for a portfolio app', hsn: '998314', base: 70000, share: 50 }] },
    { ...base(4), number: 'D2026-02', series: 'D', issueDate: '2026-07-30', dueDate: '2026-08-29', client: C('cl-bluebird'), issuer: I('iss-ka'), bank: B('bank-example-co'),
      currency: cur('INR'), model: 'hourly', items: [{ desc: 'Product design for the Atlas web app', hsn: '998314', rate: 5000, qty: 80 }] },
    { ...base(5), number: 'D2026-01', series: 'D', issueDate: '2026-05-04', dueDate: '2026-05-19', client: C('cl-orbit'), issuer: I('iss-mh'), bank: { ...B('bank-sample'), paymentMethod: 'Bank transfer' },
      currency: cur('INR'), model: 'fixed', additional: 'Total fixed compensation: ₹1,50,000 + 18% GST\n\nPayment breakdown: 30% + 50% + 20%',
      items: [{ desc: 'Product design & Design support\n(Design system)', hsn: '998314', rateText: '30%', amount: 45000 }] },
    { ...base(6), number: 'E2026-02', series: 'E', issueDate: '2026-06-02', dueDate: '2026-07-02', client: C('cl-harbor'), issuer: I('iss-mh'), bank: { ...B('bank-sample'), paymentMethod: 'International transfer' },
      currency: cur('USD'), model: 'hourly', additional: 'May 2, 2026 - June 1, 2026\n\nMonth of service: May', note: 'Please transfer the fee to the account above.',
      items: [{ desc: 'Product design and creative support', hsn: '998314', qty: 20, rate: 65 }] },
    // 2025
    { ...base(7), number: 'D2025-01', series: 'D', issueDate: '2025-01-20', dueDate: '2025-02-19', client: C('cl-bluebird'), issuer: I('iss-ka'), bank: B('bank-example-co'),
      currency: cur('INR'), model: 'hourly', items: [{ desc: 'Product design for the Atlas web app, discovery', hsn: '998314', rate: 4500, qty: 60 }] },
    { ...base(8), number: 'D2025-02', series: 'D', issueDate: '2025-03-18', dueDate: '2025-04-02', client: C('cl-orbit'), issuer: I('iss-mh'), bank: B('bank-example-co'),
      currency: cur('INR'), model: 'share', items: [{ desc: 'Storefront redesign, first milestone', hsn: '998314', base: 120000, share: 50 }] },
    { ...base(9), number: 'D2025-03', series: 'D', issueDate: '2025-06-25', dueDate: '2025-07-25', client: C('cl-riya'), issuer: I('iss-mh'), bank: B('bank-example-co'),
      currency: cur('INR'), model: 'weekly', items: [{ desc: 'Design support for a portfolio app', hsn: '998314', rate: 30000, qty: 4 }] },
    { ...base(10), number: 'E2025-02', series: 'E', issueDate: '2025-08-12', dueDate: '2025-09-11', client: C('cl-lumen'), issuer: I('iss-mh'), bank: B('bank-sample'),
      currency: cur('USD'), model: 'hourly', items: [{ desc: 'Product design for the checkout flow', hsn: '998314', rate: 60, qty: 32 }] },
    { ...base(11), number: 'D2025-04', series: 'D', issueDate: '2025-09-30', dueDate: '2025-10-30', client: C('cl-bluebird'), issuer: I('iss-ka'), bank: B('bank-example-co'),

function fmtNum(n, grouping = 'indian', decimals = 'auto') {

const amountHeader = c => `Amount (${c.code})`;

// Work backwards from a wanted total: strip the tax, then scale every item so they add up.
function setTotal(inv, wantTotal) {
  const rate = deriveTax(inv).rows.reduce((s, t) => s + t.pct, 0);
  const target = round2(wantTotal / (1 + rate / 100));
  const amt = r => itemAmount(r, inv.model);
  const cur = inv.items.reduce((s, r) => s + amt(r), 0);
  // setting an amount counts as editing it, so the linked field edited longest ago is what gives way
  const apply = (r, a) => { r.amount = round2(a); markEdited(r, inv.model, 'amount'); };
  if (!inv.items.length) inv.items.push({ desc: 'Product Design & Creative Support', hsn: '998314', rateText: 'Fixed amount', amount: 0 });
  if (cur > 0) inv.items.forEach(r => apply(r, amt(r) * target / cur));
  else { inv.items.forEach(r => apply(r, 0)); apply(inv.items[0], target); }
  const got = inv.items.reduce((s, r) => s + amt(r), 0);
  if (Math.abs(got - target) >= 0.005) apply(inv.items[0], amt(inv.items[0]) + (target - got));
}
function compute(inv) {

      const amt = linked('amount'); inputs.amount = amt;
      // HSN and the fixed-model rate text live behind a small "details" toggle; 998314 is the default
      if (!r.hsn) r.hsn = '998314';
      const details = el('div', { class: 'item-details', hidden: true }, el('div', { class: 'g2' }, field('HSN/SAC', bind(r, 'hsn')), inv.model === 'fixed' ? field('Rate column text', bind(r, 'rateText', { ph: 'Fixed amount' })) : null));
      const toggle = el('button', { class: 'btn ghost sm', type: 'button', onclick: () => { details.hidden = !details.hidden; } }, icon('caret-down'), `HSN ${r.hsn}`);
      const card = el('div', { class: 'item' },
        el('div', { class: 'head' }, bind(r, 'desc', { multi: true, rows: 1, ph: 'Item description' }),
          el('button', { class: 'btn ghost icon sm', title: 'Remove', onclick: () => { inv.items.splice(i, 1); buildItems(); touch(); refreshTotal(); } }, icon('x'))),
        el('div', { class: 'cols', style: `grid-template-columns: repeat(${cols.length + 1}, 1fr)` }, cols, field('Amount', amt)),
        el('div', { class: 'item-foot' }, toggle), details);
      paint();
      itemsBox.append(card);
    });
  };
  buildItems();
  const totalIn = el('input', { class: 'in', type: 'number', step: 'any' });
  const refreshTotal = () => { if (document.activeElement !== totalIn) totalIn.value = compute(inv).total; };
  totalIn.addEventListener('input', () => { const want = num(totalIn.value); if (!want) return; setTotal(inv, want); buildItems(); touch(); });
  totalIn.addEventListener('blur', refreshTotal);
  itemsBox.addEventListener('input', refreshTotal);
  refreshTotal();
  const modelSeg = el('div', { class: 'seg', id: 'modelSeg' }, Object.entries(MODELS).map(([k, m]) => el('button', { class: inv.model === k ? 'on' : '', title: m.name, onclick: () => { inv.model = k; for (const r of inv.items) { if (m.keys && !r.edited) r.edited = [...m.defaultEdited]; recalc(r, k); } document.querySelectorAll('#modelSeg button').forEach(b => b.classList.toggle('on', b.title === m.name)); buildItems(); touch(); refreshTotal(); } }, m.tab)));
  // currency: domestic is always INR; export gets a pill row
  const curRow = isExport(inv) ? el('div', { class: 'tabs' }, Object.keys(CURRENCIES).map(k => el('button', { class: curKey(c) === k ? 'on' : '', type: 'button', onclick: () => { inv.currency = { ...CURRENCIES[k] }; buildForm(); touch(); } }, k))) : null;
  const tax = deriveTax(inv);
  const taxLine = el('p', { class: 'hint tax-line' }, icon(tax.kind === 'export' ? 'globe-simple' : 'seal-check'), ' ', tax.why);
  // extras as add links
  const extra = (key, label) => { const ta = bind(inv, key, { multi: true, rows: 2, ph: label }); const f = field(label, ta); const link = el('button', { class: 'btn ghost sm', type: 'button', onclick: () => { f.hidden = false; link.hidden = true; ta.focus(); } }, icon('plus'), label); if (!inv[key]) f.hidden = true; else link.hidden = true; return [link, f]; };
  const [addLink, addField] = extra('additional', 'Additional details'), [noteLink, noteField] = extra('note', 'Note');
  side.append(el('div', { class: 'sec' },
    el('h3', {}, icon('calculator'), 'Items', el('span', { class: 'spacer' }), curRow),
    modelSeg,
    itemsBox,
    el('button', { class: 'btn sm', onclick: () => { inv.items.push({ desc: 'New item', hsn: '998314', rateText: 'Fixed amount', amount: 0, edited: MODELS[inv.model]?.defaultEdited ? [...MODELS[inv.model].defaultEdited] : undefined }); buildItems(); touch(); refreshTotal(); } }, icon('plus'), 'Item'),
    el('div', { style: 'height:12px' }),
    field('Total incl. tax (type it to work the items out backwards)', totalIn),
    taxLine));

  // ----- from: issuer + bank in one collapsed section -----
  side.append(section('from', 'From', 'buildings', [el('button', { class: 'btn ghost sm', onclick: () => openPicker('issuers', null, ['issuers', 'banks']) }, icon('arrows-left-right'), 'Change')],
    [summaryCard('issuers', inv.issuer), el('div', { style: 'height:8px' }), summaryCard('banks', inv.bank)], { collapsible: true }));

  // ----- extras: add links at the bottom -----
  side.append(el('div', { class: 'sec' }, el('div', { class: 'extras' }, addLink, noteLink), addField, noteField));
  refreshStatus();
}

/* ======================= invoice list ======================= */
let justAdded = null; // the row that should slide in on the next list build
// Collapse a list row upward, then run `done` (which removes it from state and rebuilds the list).
function animateRowOut(id, done) { ui.rowOut(document.querySelector(`#invlist .row[data-id="${id}"]`), done); }
let draftsShown = false;   // whether the last list render had drafts, to animate the empty state in
function buildList() {
  const v = document.getElementById('invlist'); const scroll = v.scrollTop; v.innerHTML = '';
  const row = (inv, isDraft) => {
    const shown = isDraft ? inv : (state.edits[inv.id] || inv);
    const { total } = compute(shown);
    return el('div', { class: 'row' + (inv.id === state.currentId ? ' on' : '') + (isDraft ? ' draft' : '') + (inv.id === justAdded ? ' enter' : ''), 'data-id': inv.id, onclick: () => openInvoice(inv.id) },
      el('div', { class: 'n' }, shown.number || '(no number)', isDirtyId(inv.id) && !isDraft ? el('span', { class: 'dot', title: 'Unsaved changes' }) : null),
      el('div', { class: 'sub' }, fmtMoney(total, shown.currency, 'never')),
      el('div', { class: 'sub' }, shown.client?.name || '—'),
      el('div', { class: 'sub' }, fmtDate(inv.issueDate)),
      el('button', { class: 'btn sm secondary row-action', onclick: e => { e.stopPropagation();
        ui.confirmClick(e.currentTarget, { resetOn: e.currentTarget.closest('.row'), onConfirm: () => { if (isDraft) { state.currentId = inv.id; discardWorking(); toast('Draft discarded'); } else deleteInvoice(inv.id); } }); } }, 'Delete'));
  };
  v.append(el('div', { class: 'list-top' }, el('button', { class: 'btn sm', title: 'Start a new invoice like the current one', onclick: () => newInvoice(working()?.series || 'D') }, 'New invoice')),
    el('div', { class: 'list-h' }, 'Drafts'));
  if (disk) disk.bar(v);
  // when the last draft goes, "No drafts yet" grows in with the same motion as a new row
  const emptyNow = !state.drafts.length, emptyEl = emptyNow ? el('div', { class: 'list-empty' }, 'No drafts yet') : null;
  if (emptyEl) v.append(emptyEl);
  state.drafts.forEach(d => v.append(row(d, true)));
  const saved = [...state.invoices].sort((a, b) => (b.issueDate || '').localeCompare(a.issueDate || '') || (b.number || '').localeCompare(a.number || ''));
  let year = null;
  for (const inv of saved) { const y = (inv.issueDate || '').slice(0, 4) || 'Undated'; if (y !== year) { year = y; v.append(el('div', { class: 'list-h' }, y)); } v.append(row(inv, false)); }
  if (!saved.length && !state.drafts.length) v.append(el('div', { class: 'empty' }, 'No invoices yet.'));
  v.scrollTop = scroll; justAdded = null;
  const fresh = v.querySelector('.row.enter'); if (fresh) ui.rowIn(fresh);
  if (emptyEl && draftsShown) ui.rowIn(emptyEl);
  draftsShown = !emptyNow;
  const on = v.querySelector('.row.on'); if (on && (on.offsetTop < v.scrollTop || on.offsetTop + on.offsetHeight > v.scrollTop + v.clientHeight)) on.scrollIntoView({ block: 'nearest' });
}

/* ======================= render and actions ======================= */
function renderAll() { ensureWorking(); buildList(); buildForm(); renderPage(); refreshTopbar(); }
const openEditor = renderAll;
document.getElementById('btnSave').onclick = saveWorking;
document.getElementById('btnDup').onclick = () => duplicateInvoice();
document.getElementById('pvTools').addEventListener('click', e => {
  const ser = e.target.closest('[data-series]'); if (ser) { const inv = working(); if (inv.series !== ser.dataset.series) switchSeries(inv, ser.dataset.series); return; }
});


document.getElementById('btnDel').onclick = () => {
  if (!working()) return;
  if (!savedOf()) { discardWorking(); toast('Draft discarded'); return; }
  if (isDirty()) { discardWorking(); toast('Changes discarded'); return; }
  deleteInvoice(state.currentId);
};
document.getElementById('btnPdf').onclick = () => { if (!working()) return; if (isDirty() && !saveWorking()) return; setTimeout(() => window.print(), 50); };
window.addEventListener('beforeprint', () => { const inv = working(); if (inv) document.title = inv.number; });
window.addEventListener('afterprint', () => { document.title = 'Invoices'; });

load();
{ // ?open=E2026-04 selects that saved invoice
  const want = new URLSearchParams(location.search).get('open');
  const hit = want && state.invoices.find(i => i.number === want);
  if (hit) state.currentId = hit.id;
}
renderAll();
document.fonts.ready.then(() => fitPreview());
// mirror the state to <folder>/invoices.json once a data folder is connected; the file wins if it is newer
dataset.banner('invoices');
if (dataset.own) {
  const partiesDisk = parties.attach(() => { if (state) { sharedParties(state); renderAll(); } });
  disk = store.attach({ key: 'invoices', get: () => state, set: d => { state = d; migrateWorking(state); migrateModels(state); sharedParties(state); }, adopt: () => { partiesDisk?.sync(); renderAll(); } });
  partiesDisk?.sync();
}
// once the folder is connected, anything still in the browser buffer is written out and the buffer is dropped
disk?.sync()?.then(st => { buildList(); if (st === 'connected' && dataset.buffer.read(LS_KEY)) save(); });
</script>
